services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./web
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${FILESYSTEM_ROOT:-./mnt_ro}:/mnt:ro
      - ./certs:/certs:rw
      - ./nginx/generated:/nginx-generated:rw
    # web writes nginx/generated/domains.conf during startup, so nginx must not
    # start until web is healthy - otherwise a fresh clone boots nginx with no
    # server blocks.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  # Reverse proxy: the only container publishing a host port for web
  # traffic. Terminates TLS (self-signed cert, generated by
  # `./setup.sh --configure-tls`) and forwards to `web` over plain HTTP on
  # the internal Docker network. See docs/tls.md.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "9443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./nginx/generated:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    env_file: .env
    ports:
      - "15672:15672"
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  worker:
    build: ./worker
    command: ["celery", "-A", "app.celery_app", "worker", "-Q", "copy", "-n", "worker@%h", "--loglevel=info"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${FILESYSTEM_ROOT:-./mnt_ro}:/mnt:rw
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy

  flower:
    build: ./flower
    restart: unless-stopped
    env_file: .env
    ports:
      - "5555:5555"
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy

  #terminator service has the power to manage docker containers, create start and stop them, and also has the ability to manage docker networks. It is a powerful tool that can be used to automate the management of docker containers and networks. It can be controlled through an internal rest api supported by fastapi (only available on this network). This way, containers can be indirectly managed through terminator without all services needing access to the docker socket. This is a security measure to prevent unauthorized access to the docker socket.
  # No host port published - reachable only from other containers on this compose network.
  # Its API is further restricted to an allowlist of services (worker) and requires
  # TERMINATOR_API_KEY, since anything with access to the docker socket has host-level power.
  terminator:
    build: ./terminator
    restart: unless-stopped
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  db_data:
