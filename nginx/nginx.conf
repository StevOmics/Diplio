worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Hide Nginx version from response headers and error pages.
    server_tokens off;

    # Brute-force throttling for the login endpoint. Zone is sized for a
    # handful of clients on an internal network, not internet-scale traffic.
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # No known upper bound on legitimate request bodies yet (movie files can
    # stream through web-facing routes) - left unlimited until that's
    # measured. See docs/TODO.md.
    client_max_body_size 0;

    log_format main '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # The domain list, redirect toggle, and cert-driven server blocks are
    # generated by web/app/tls.py (Settings > TLS / Domain) into
    # ./nginx/generated, bind-mounted here read-only - see docs/tls.md.
    # A default equivalent to the old hardcoded blocks ships in that
    # directory so a fresh clone works with no Settings action taken yet.
    include /etc/nginx/conf.d/*.conf;
}
