<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Diplio - Login</title>
  <style>
    body {
      font-family: system-ui, sans-serif; color: #222; margin: 0;
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
      background: #1e293b;
    }
    .card {
      background: white; padding: 2rem; border-radius: 8px; width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    h1 { font-size: 1.25rem; margin: 0 0 1.25rem; }
    label { display: block; font-size: 0.85rem; margin-bottom: 0.25rem; color: #444; }
    input {
      width: 100%; padding: 0.5rem 0.6rem; font-size: 1rem; margin-bottom: 1rem;
      border: 1px solid #ccc; border-radius: 4px;
    }
    button {
      width: 100%; padding: 0.6rem; font-size: 1rem; background: #2563eb; color: white;
      border: none; border-radius: 4px; cursor: pointer;
    }
    .error { color: #b91c1c; font-size: 0.85rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>Diplio</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autofocus required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
    <button type="submit">Log in</button>
  </form>
</body>
</html>
